name: Host build, parser tests and safety checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    name: C99 (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Documentation checks
        run: |
          test -s README.md
          test -s LICENSE
          test -s docs/SPECIFICATION.md
          test -s docs/ENGINEERING_JOURNAL.md
          test -s docs/IFF_FORMAT.md
          test -s docs/AMIGA_IO.md
  sanitizers:
    name: AddressSanitizer + UBSan (host)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  native-smoke-host:
    name: Native-only source separation (host dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure without POSIX backends
        run: cmake -S . -B build-native-host -DDOLLY_NATIVE_ONLY=ON -DCMAKE_C_FLAGS="-Wall -Wextra -Werror -Wpedantic"
      - name: Compile portable native smoke
        run: cmake --build build-native-host --parallel
      - name: Run memory-only selftest
        run: ctest --test-dir build-native-host --output-on-failure
      - name: Notice
        run: echo "This is a host dry run, NOT a Motorola 68000 or AmigaOS binary test."
